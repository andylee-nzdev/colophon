services:
  db:
    image: postgres:18-alpine
    container_name: colophon-db
    environment:
      POSTGRES_DB: colophon
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123456
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images store data in a version-specific subdirectory,
      # so the mount goes at /var/lib/postgresql, not .../data.
      - colophon-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d colophon"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin:
    image: node:26-alpine
    container_name: colophon-admin
    working_dir: /app
    # Vite's dev server, not a build — the SPA is served by the container but the
    # bundle is still produced on the fly, so edits on the host hot-reload.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Read by the browser, not the container, so it points at the host-run API
      # (`./mvnw spring-boot:run`) rather than a compose service name.
      VITE_API_URL: http://localhost:8080
    ports:
      # Must stay 5173 — the API's CORS allowed-origins default is this exact origin.
      - "5173:5173"
    volumes:
      - ./apps/admin:/app
      # Keeps the container's Linux node_modules out of the host's macOS ones;
      # some deps (rolldown, oxlint) ship platform-specific binaries.
      - colophon-admin-node-modules:/app/node_modules

volumes:
  colophon-db-data:
  colophon-admin-node-modules:

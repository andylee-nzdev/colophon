spring:
  application:
    name: colophon
  datasource:
    url: ${COLOPHON_DB_URL:jdbc:postgresql://localhost:5432/colophon}
    username: ${COLOPHON_DB_USER:admin}
    password: ${COLOPHON_DB_PASSWORD:admin123456}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations — never generated by Hibernate.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        # The static-site build fetches a whole locale in one call, so allow a large page.
        max-page-size: 200
  logging:
    level:
      org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

colophon:
  content:
    # Applied when a write request omits `locale`.
    default-locale: en
  cors:
    # The admin SPA's origin. Vite's dev server by default; the deployed admin URL in
    # production, set through COLOPHON_CORS_ALLOWED_ORIGINS (comma-separated).
    allowed-origins: ${COLOPHON_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  application:
    name: colophon
  datasource:
    url: ${COLOPHON_DB_URL:jdbc:postgresql://localhost:5432/colophon}
    username: ${COLOPHON_DB_USER:admin}
    password: ${COLOPHON_DB_PASSWORD:admin123456}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations — never generated by Hibernate.
      ddl-auto: validate
  logging:
    level:
      org.hibernate.orm.jdbc.bind: TRACE
